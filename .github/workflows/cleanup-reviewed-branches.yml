name: Remove reviewed LMS work branches
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-reviewed-branches.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const targets = [{"name":"feature/role-article-progress","sha":"9cce0322e8cf3864b2d612cfc4f4867bfb27e67f"},{"name":"refactor/rename-lms-to-yuyu-learning","sha":"5a0d690bb1b7331c74dc6c295402eac6d385e43b"},{"name":"release/yuyulearning-0.9.0-beta.5","sha":"b902a00790d9d89b7f8810998fc073491700f72d"},{"name":"release/0.9.0-beta.3","sha":"65dd06dd1cb1f72685503e853178dae65e212d4c"}];
            for (const t of targets) {
              if (['main', 'connect-cms-v2'].includes(t.name)) throw new Error('Protected branch');
              const r = await github.rest.git.getRef({...context.repo, ref: 'heads/' + t.name});
              if (r.data.object.sha !== t.sha) throw new Error('Branch changed: ' + t.name);
            }
            for (const t of targets) {
              await github.rest.git.deleteRef({...context.repo, ref: 'heads/' + t.name});
              core.info('Deleted ' + t.name);
            }
